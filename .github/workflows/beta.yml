# Publishes Bathhouse from beta as GitHub prereleases on every merge, so each upstream Meitou build the engine moves to (engine-update.yml)
# has a matching mod build to play: bathhouse-<version>-beta.<commit> (never moved) and rolling bathhouse-beta (Bathhouse-beta.zip).
# Packaging: GutenStructure package-meitou-mod.yml, pinned to a commit that packs items/ and imported models.
name: Beta prerelease

on:
  push:
    branches: [beta]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    if: github.ref == 'refs/heads/beta'
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@b8fc4ac1481cd27e036fdd5ed8074ea826dae701
    with:
      mod-folder: Bathhouse
      slug: bathhouse
      channel: beta
      test-project: .
      empty-data-mod: true
